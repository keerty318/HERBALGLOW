<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>HerbalGlow</title>
    <link rel="icon" href="{{url_for('static',filename='IMAGES/mainlogos.png')}}">
    <link rel="stylesheet" href="{{ url_for('static', filename='BOOTSTRAP/bootstrap-5.3.8-dist/bootstrap-5.3.8-dist/css/bootstrap.min.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='CSS/style.css') }}">
    <link rel="stylesheet"href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css"/>
  </head>
  <body class="login">
    <!-- watsapp logo -->
    <a href="https://wa.me/918903077052" class="watsapp-btn" target="_blank">
      <img
        src="https://upload.wikimedia.org/wikipedia/commons/6/6b/WhatsApp.svg"
        alt="watsapp"
      />
    </a>
    <!-- header bar -->
    <header class="main-header">HerbalGlow</header>
    <p style="text-align: center" class="header-subline">Handmade with care</p>

  
  <section class="register">
  

    <div class="login-heading">
      <h2 >Login</h2>
    </div>

    <form class="login-form" action="/login" method="post">

      <div class="form-group">
        <label >👤Username</label>
        <input type="text" class="form-control" required name="uname">
      </div>

      <div class="form-group">
        <label style="font-size: large;">🔑Password</label>
        <input type="password" class="form-control" required name="pwd">
      </div>



      <div class="form-group">
        <button type="submit"
          class="btn"
          style="background:linear-gradient(to right,#0097b2,#7ed957); color:white; border:none;padding-left: 34px;padding-right :34px;font-size: 20px;">
          Log in
        </button>
      </div>

      <p style="text-align:center; font-size:20px; margin-top: 20px;">
        Haven't signed up yet?
      </p>

      <p style="text-align:center;">
        <a href="/register">Create account</a>
      </p>

    </form>

    <!-- to display msgs/errors -->

    <!-- jinja -->
     {% if message %}
      <p style="text-align:center; font-weight:bold;">
        {{ message }}
      </p>
      {% endif %}

  
</section>


    <script src="{{ url_for('static', filename='BOOTSTRAP/bootstrap-5.3.8-dist/bootstrap-5.3.8-dist/js/bootstrap.bundle.min.js') }}"></script>

  </body>
</html>
